        // FUNGSI UTILITY (PRE-PROCESSING)

        /**
         * Mengubah nilai numerik menjadi format Rupiah.
         */
        const formatRupiah = (number) => {
            return new Intl.NumberFormat('id-ID', {
                style: 'currency',
                currency: 'IDR',
                minimumFractionDigits: 0
            }).format(number);
        };
        
        /**
         * Secara rekursif memproses data JSON hirarkis menjadi map datar.
         * Menggunakan Unique ID (path-based) untuk kunci map agar data dengan nama sama
         * di tanggal berbeda tidak saling menimpa.
         * * @param {Object} node - Node data saat ini (memiliki properti list)
         * @param {string} currentId - ID Unik untuk grup data node ini (misal: 'ROOT' atau '2025-12-14_JATIM')
         */
        const processedDataMap = {};
        
        function processNode(node, currentId) {
            // Jika node tidak memiliki anak, berhenti.
            if (!node.list || node.list.length === 0) return;

            const chartData = [];
            
            node.list.forEach(child => {
                // Tentukan nama tampilan.
                // Untuk level 0, gunakan 'date'. Untuk level selanjutnya, gunakan 'name'.
                const childDisplayName = child.date || child.name;
                
                // Buat Unique ID untuk anak ini.
                // ID ini akan menjadi kunci untuk membuka 'list' milik anak tersebut.
                // Contoh: ROOT -> 2025-12-14
                // Contoh: 2025-12-14 -> 2025-12-14_PROPINSI JATIM
                const childUniqueId = currentId === 'ROOT' 
                    ? childDisplayName 
                    : `${currentId}_${childDisplayName}`;
                
                const hasChildren = child.list && child.list.length > 0;
                
                // Format Data ECharts: [Name, Value, ChildGroupId]
                // ChildGroupId hanya disertakan jika anak tersebut memiliki list sendiri.
                chartData.push([
                    childDisplayName,
                    child.value,
                    hasChildren ? childUniqueId : undefined
                ]);
                
                // Rekursi jika punya anak
                if (hasChildren) {
                    processNode(child, childUniqueId);
                }
            });

            // Simpan konfigurasi untuk Group ID ini
            processedDataMap[currentId] = {
                dataGroupId: currentId,
                data: chartData
            };
        }

        // Bungkus array rawData ke dalam objek root sintetis untuk memulai proses
        const syntheticRoot = {
            list: rawData
        };

        // Mulai pemrosesan data dari 'ROOT'
        processNode(syntheticRoot, 'ROOT');
        
        // Data Groups sekarang adalah nilai-nilai dari processedDataMap
        const allDataGroups = Object.values(processedDataMap);
        
        // =========================================================================
        // LOGIKA ECHARTS (DRILL DOWN)
        // =========================================================================

        // Objek untuk menyimpan semua konfigurasi opsi
        const allOptionsWithItemGroupId = {};
        const allOptionsWithoutItemGroupId = {};

        // Generate opsi untuk setiap grup data
        allDataGroups.forEach((dataGroup) => {
            const { dataGroupId, data } = dataGroup;
            
            // Logika Judul Dinamis
            let titleText = '';
            let subText = '';
            
            if (dataGroupId === 'ROOT') {
                titleText = 'Total Pendapatan Harian';
                // Hitung total semua tanggal untuk subtext
                const totalAll = data.reduce((sum, item) => sum + item[1], 0);
                subText = `Total Keseluruhan: ${formatRupiah(totalAll)}`;
            } else {
                // Ambil bagian terakhir dari ID unik untuk judul (misal: ambil "PROPINSI JATIM" dari "2025-12-14_PROPINSI JATIM")
                const nameParts = dataGroupId.split('_');
                const displayName = nameParts[nameParts.length - 1];
                // Jika ID-nya tanggal (misal "2025-12-14"), tampilkan tanggalnya
                // Jika ID-nya path (misal "2025-12-14_JATIM"), tampilkan nama node terakhir
                titleText = nameParts.length === 1 ? `Pendapatan Tanggal ${displayName}` : `Rincian: ${displayName}`;
                
                // Total untuk grup ini
                const totalGroup = data.reduce((sum, item) => sum + item[1], 0);
                subText = `Total: ${formatRupiah(totalGroup)}`;
            }

            // Konfigurasi umum untuk Tooltip
            const tooltipConfig = {
                trigger: 'axis',
                axisPointer: { type: 'shadow' },
                formatter: function(params) {
                    const item = params[0];
                    return `<strong>${item.name}</strong><br/>${item.seriesName}: ${formatRupiah(item.value[1])}`;
                }
            };

            // Opsi 1: Dengan itemGroupId (target transisi)
            const optionWithItemGroupId = {
                title: {
                    text: titleText,
                    subtext: subText,
                    left: 'center',
                    textStyle: { fontSize: 16 }
                },
                tooltip: tooltipConfig,
                grid: { left: '3%', right: '4%', bottom: '3%', containLabel: true },
                xAxis: {
                    type: 'category',
                    axisLabel: {
                        interval: 0,
                        rotate: 30, 
                        margin: 10,
                        formatter: function(value) {
                            // Potong label jika terlalu panjang agar rapi
                            return value.length > 15 ? value.substring(0, 15) + '...' : value;
                        }
                    }
                },
                yAxis: {
                    type: 'value',
                    axisLabel: {
                        formatter: function(value) {
                            if (value >= 1000000000) return formatRupiah(value / 1000000000) + ' M';
                            else if (value >= 1000000) return formatRupiah(value / 1000000) + ' Jt';
                            return formatRupiah(value);
                        }
                    }
                },
                animationDurationUpdate: 500,
                series: {
                    name: 'Nilai',
                    type: 'bar',
                    dataGroupId: dataGroupId,
                    encode: {
                        x: 0,
                        y: 1,
                        itemGroupId: 2 // Kolom ke-3 berisi Child ID untuk drill-down
                    },
                    data: data,
                    universalTransition: {
                        enabled: true,
                        divideShape: 'clone'
                    },
                    itemStyle: {
                        // Memberikan warna berbeda jika di Root (Tanggal)
                        color: dataGroupId === 'ROOT' ? '#3b82f6' : '#6366f1'
                    }
                },
                graphic: [
                    {
                        type: 'text',
                        left: 50,
                        top: 20,
                        style: {
                            text: dataGroupId === 'ROOT' ? 'Root' : '← Kembali',
                            fontSize: 18,
                            fill: dataGroupId === 'ROOT' ? '#9ca3af' : '#2563eb', 
                            fontWeight: 'bold',
                            cursor: dataGroupId === 'ROOT' ? 'default' : 'pointer'
                        },
                        onclick: function () {
                            if (dataGroupId !== 'ROOT') {
                                goBack();
                            }
                        }
                    }
                ]
            };

            // Opsi 2: Tanpa itemGroupId (sumber transisi)
            const optionWithoutItemGroupId = JSON.parse(JSON.stringify(optionWithItemGroupId));
            optionWithoutItemGroupId.series.encode = { x: 0, y: 1 };
            optionWithoutItemGroupId.series.data = data.map((item) => {
                return item.slice(0, 2); // Hanya ambil [Nama, Value]
            });

            allOptionsWithItemGroupId[dataGroupId] = optionWithItemGroupId;
            allOptionsWithoutItemGroupId[dataGroupId] = optionWithoutItemGroupId;
        });

        // Stack untuk menyimpan history navigasi
        const dataGroupIdStack = [];

        /**
         * Drill Down ke level berikutnya.
         */
        const goForward = (dataGroupId) => {
            const currentDataGroupId = myChart.getOption().series[0].dataGroupId;
            
            // Validasi: Apakah target grup ada?
            if (!allOptionsWithItemGroupId[dataGroupId]) {
                console.log(`Grup data "${dataGroupId}" adalah level terakhir (Leaf Node).`);
                return;
            }
            
            dataGroupIdStack.push(currentDataGroupId); 
            
            // Transisi mulus ECharts
            myChart.setOption(allOptionsWithoutItemGroupId[dataGroupId], false);
            myChart.setOption(allOptionsWithItemGroupId[dataGroupId], false); 
        };

        /**
         * Drill Up (Kembali) ke level sebelumnya.
         */
        const goBack = () => {
            if (dataGroupIdStack.length === 0) {
                console.log('Sudah berada di data root!');
            } else {
                const previousDataGroupId = dataGroupIdStack.pop();
                
                myChart.setOption(
                    allOptionsWithoutItemGroupId[myChart.getOption().series[0].dataGroupId],
                    false
                );
                myChart.setOption(allOptionsWithItemGroupId[previousDataGroupId], false); 
            }
        };

        // Opsi awal adalah grup 'ROOT' (Tanggal)
        let initialOption = allOptionsWithItemGroupId['ROOT'];

        // Handler klik
        myChart.on('click', 'series.bar', (params) => {
            // params.data[2] berisi Child Unique ID
            if (params.data && params.data[2]) {
                goForward(params.data[2]);
            }
        });

        // Render awal
        if (initialOption) {
            myChart.setOption(initialOption);
        } else {
            console.error("Gagal inisialisasi. Cek struktur data.");
        }

    </script>
</body>
</html>
