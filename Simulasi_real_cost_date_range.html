        }
        .daterange-predefined-pendapatan {
            cursor: pointer;
            display: flex;
            align-items: center;
            background: #fff;
            border: 1px solid #ced4da;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.875rem;
            color: #495057;
            transition: all 0.2s;
        }
        .daterange-predefined-pendapatan:hover {
            background-color: #f8f9fa;
        }
        .period-dropdown {
            border-radius: 6px;
            font-size: 0.875rem;
            border: 1px solid #ced4da;
            padding: 6px 12px;
            background-color: white;
            cursor: pointer;
        }
    </style>

        const formatRupiah = (number) => {
            return new Intl.NumberFormat('id-ID', {
                style: 'currency',
                currency: 'IDR',
                minimumFractionDigits: 0
            }).format(number);
        };

        $(document).ready(function() {
            // Polyfill Notification
            if (!$.jGrowl) {
                $.jGrowl = function(message) {
                    const toast = $('<div class="fixed bottom-5 right-5 bg-slate-800 text-white px-4 py-2 rounded shadow-lg z-50 text-sm animate-bounce">' + message + '</div>');
                    $('body').append(toast);
                    setTimeout(() => toast.fadeOut(500, () => toast.remove()), 2000);
                };
            }

            // Inisialisasi DatePicker
            $('.daterange-predefined-pendapatan').daterangepicker({
                startDate: moment().startOf('year'),
                endDate: moment().endOf('year'),
                ranges: {
                    'Hari Ini': [moment(), moment()],
                    'Bulan Ini': [moment().startOf('month'), moment().endOf('month')],
                    'Tahun Ini': [moment().startOf('year'), moment().endOf('year')],
                    'Semua Waktu': [moment("2016-01-01"), moment()]
                },
                opens: 'left',
                applyClass: 'btn-sm bg-primary text-white',
                cancelClass: 'btn-sm btn-light'
            }, function(start, end) {
                updateUI(start, end);
            });

            // Set Label Awal
            const startInit = moment().startOf('year');
            const endInit = moment().endOf('year');
            $('.daterange-predefined-pendapatan span').html(startInit.format('MMM D, YY') + ' - ' + endInit.format('MMM D, YY'));
            
            // Event Listener Dropdown
            $('#period-select').on('change', function() {
                const drp = $('.daterange-predefined-pendapatan').data('daterangepicker');
                updateUI(drp.startDate, drp.endDate);
            });

            // Render Pertama Kali
            updateUI(startInit, endInit);
        });

        function updateUI(start, end) {
            $('.daterange-predefined-pendapatan span').html(start.format('MMM D, YY') + ' - ' + end.format('MMM D, YY'));
            const period = $('#period-select').val();
            
            // 1. Filter Berdasarkan Tanggal
            let filtered = rawData.filter(item => {
                const d = moment(item.date);
                return d.isSameOrAfter(start, 'day') && d.isSameOrBefore(end, 'day');
            });

            // 2. Agregasi Berdasarkan Periode
            let aggregated = aggregateData(filtered, period);
            
            $.jGrowl('Data diperbarui: ' + period.toUpperCase());
            renderChart(aggregated);
        }

        /**
         * Kalkulasi data harian menjadi periode tertentu (Mingguan, Bulanan, dll)
         */
        function aggregateData(data, period) {
            if (period === 'harian') return data;

            const groups = {};
            data.forEach(item => {
                let key = '';
                const m = moment(item.date);
                if (period === 'mingguan') key = 'Minggu ' + m.isoWeek() + ' (' + m.format('YYYY') + ')';
                else if (period === 'bulanan') key = m.format('MMMM YYYY');
                else if (period === 'triwulanan') key = 'Kuartal ' + m.quarter() + ' (' + m.format('YYYY') + ')';
                else if (period === 'tahunan') key = m.format('YYYY');

                if (!groups[key]) {
                    groups[key] = { name: "PENDAPATAN", date: key, value: 0, list: [] };
                }
                groups[key].value += item.value;
                
                // Agregasi kategori di dalam periode agar drill-down tetap akurat
                item.list.forEach(child => {
                    let existingChild = groups[key].list.find(c => c.name === child.name);
                    if (existingChild) {
                        existingChild.value += child.value;
                        // Penggabungan rekursif sederhana untuk level 3
                        if (child.list) {
                            if (!existingChild.list) existingChild.list = [];
                            child.list.forEach(sub => {
                                let exSub = existingChild.list.find(s => s.name === sub.name);
                                if (exSub) exSub.value += sub.value;
                                else existingChild.list.push(JSON.parse(JSON.stringify(sub)));
                            });
                        }
                    } else {
                        groups[key].list.push(JSON.parse(JSON.stringify(child)));
                    }
                });
            });

            return Object.values(groups).sort((a, b) => {
                // Sorting sederhana berdasarkan string key (misal Tahun atau Bulan)
                return a.date.localeCompare(b.date);
            });
        }

        /**
         * FUNGSI UTAMA RENDER ECHARTS (DRILL DOWN LOGIC)
         */
        function renderChart(dataToRender) {
            allOptionsWithItemGroupId = {};
            allOptionsWithoutItemGroupId = {};
            dataGroupIdStack = [];
            
            // =========================================================================
            // FUNGSI UTILITY (PRE-PROCESSING)
            // =========================================================================
            const processedDataMap = {};
            
            function processNode(node, currentId) {
                if (!node.list || node.list.length === 0) return;

                const chartData = [];
                node.list.forEach(child => {
                    const childDisplayName = child.date || child.name;
                    const childUniqueId = currentId === 'ROOT' 
                        ? childDisplayName 
                        : `${currentId}_${childDisplayName}`;
                    
                    const hasChildren = child.list && child.list.length > 0;
                    
                    chartData.push([
                        childDisplayName,
                        child.value,
                        hasChildren ? childUniqueId : undefined
                    ]);
                    
                    if (hasChildren) {
                        processNode(child, childUniqueId);
                    }
                });

                processedDataMap[currentId] = {
                    dataGroupId: currentId,
                    data: chartData
                };
            }

            processNode({ list: dataToRender }, 'ROOT');
            const allDataGroups = Object.values(processedDataMap);

            if (allDataGroups.length === 0) {
                myChart.clear();
                myChart.setOption({
                    title: { text: 'Tidak ada data dalam rentang ini', left: 'center', top: 'center' }
                });
                return;
            }

            // =========================================================================
            // GENERATE SEMUA OPSI ECHARTS
            // =========================================================================
            allDataGroups.forEach((dataGroup) => {
                const { dataGroupId, data } = dataGroup;
                
                let titleText = '';
                let subText = '';
                
                if (dataGroupId === 'ROOT') {
                    titleText = 'Total Pendapatan';
                    const totalAll = data.reduce((sum, item) => sum + item[1], 0);
                    subText = `Total Keseluruhan: ${formatRupiah(totalAll)}`;
                } else {
                    const nameParts = dataGroupId.split('_');
                    const displayName = nameParts[nameParts.length - 1];
                    titleText = nameParts.length === 1 ? `Pendapatan: ${displayName}` : `Rincian: ${displayName}`;
                    const totalGroup = data.reduce((sum, item) => sum + item[1], 0);
                    subText = `Total: ${formatRupiah(totalGroup)}`;
                }

                const optionWithItemGroupId = {
                    title: {
                        text: titleText,
                        subtext: subText,
                        left: 'center',
                        textStyle: { fontSize: 16 }
                    },
                    tooltip: {
                        trigger: 'axis',
                        axisPointer: { type: 'shadow' },
                        formatter: (params) => `<strong>${params[0].name}</strong><br/>${formatRupiah(params[0].value[1])}`
                    },
                    grid: { left: '3%', right: '4%', bottom: '10%', containLabel: true },
                    xAxis: {
                        type: 'category',
                        axisLabel: {
                            interval: 0,
                            rotate: 30,
                            formatter: (val) => val.length > 15 ? val.substring(0, 15) + '...' : val
                        }
                    },
                    yAxis: {
                        type: 'value',
                        axisLabel: {
                            formatter: (value) => {
                                if (value >= 1000000000) return (value / 1000000000).toFixed(1) + ' M';
                                if (value >= 1000000) return (value / 1000000).toFixed(1) + ' Jt';
                                return value;
                            }
                        }
                    },
                    animationDurationUpdate: 500,
                    series: {
                        name: 'Nilai',
                        type: 'bar',
                        dataGroupId: dataGroupId,
                        encode: { x: 0, y: 1, itemGroupId: 2 },
                        data: data,
                        universalTransition: { enabled: true, divideShape: 'clone' },
                        itemStyle: { color: dataGroupId === 'ROOT' ? '#3b82f6' : '#6366f1' }
                    },
                    graphic: [{
                        type: 'text',
                        left: 50,
                        top: 20,
                        style: {
                            text: dataGroupId === 'ROOT' ? '' : '← Kembali',
                            fontSize: 16,
                            fill: '#2563eb',
                            fontWeight: 'bold',
                            cursor: 'pointer'
                        },
                        onclick: function () { if (dataGroupId !== 'ROOT') goBack(); }
                    }]
                };

                const optionWithoutItemGroupId = JSON.parse(JSON.stringify(optionWithItemGroupId));
                optionWithoutItemGroupId.series.encode = { x: 0, y: 1 };
                optionWithoutItemGroupId.series.data = data.map(i => i.slice(0, 2));

                allOptionsWithItemGroupId[dataGroupId] = optionWithItemGroupId;
                allOptionsWithoutItemGroupId[dataGroupId] = optionWithoutItemGroupId;
            });

            myChart.setOption(allOptionsWithItemGroupId['ROOT'], true);
        }

        /**
         * LOGIKA NAVIGASI
         */
        const goForward = (dataGroupId) => {
            const currentId = myChart.getOption().series[0].dataGroupId;
            if (!allOptionsWithItemGroupId[dataGroupId]) return;
            
            dataGroupIdStack.push(currentId); 
            myChart.setOption(allOptionsWithoutItemGroupId[dataGroupId], false);
            myChart.setOption(allOptionsWithItemGroupId[dataGroupId], false); 
        };

        const goBack = () => {
            if (dataGroupIdStack.length === 0) return;
            const previousId = dataGroupIdStack.pop();
            myChart.setOption(allOptionsWithoutItemGroupId[myChart.getOption().series[0].dataGroupId], false);
            myChart.setOption(allOptionsWithItemGroupId[previousId], false); 
        };

        myChart.on('click', 'series.bar', (params) => {
            if (params.data && params.data[2]) goForward(params.data[2]);
        });

        window.addEventListener('resize', () => myChart.resize());

    </script>
</body>
